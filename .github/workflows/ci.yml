name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 12.11.2
  UV_VERSION: 0.9.18

jobs:
  web:
    name: Web setup checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install locked Node.js dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source, configuration and documentation formatting
        run: pnpm --filter @onholidai/web format:check
      - name: Lint web
        run: pnpm --filter @onholidai/web lint
      - name: Type-check web
        run: pnpm --filter @onholidai/web typecheck
      - name: Build web
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: build-only-auth-secret-0000000000000000
          SERVICE_TOKEN_SECRET: build-only-service-secret-000000000000
          PRICING_DIAGNOSTIC_SECRET: build-only-pricing-secret-000000000000
        run: pnpm --filter @onholidai/web build
      - name: Detect Vitest suites
        id: vitest
        shell: bash
        run: |
          if find web/tests -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Vitest suites are not implemented yet; skipping."
          fi
      - name: Run Vitest suites
        if: steps.vitest.outputs.available == 'true'
        run: pnpm --dir web exec vitest run tests/unit

  foundation:
    name: PostgreSQL foundation behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:synthetic-admin@localhost:5432/postgres
      TEST_DATABASE_MIGRATION_URL: postgresql://onholidai_migration:synthetic-migration@localhost:5432/postgres
      TEST_DATABASE_APP_URL: postgresql://onholidai_web:synthetic-web@localhost:5432/postgres
      TEST_DATABASE_WORKER_URL: postgresql://onholidai_worker:synthetic-worker@localhost:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install locked Node.js dependencies
        run: pnpm install --frozen-lockfile
      - name: Provision least-privileged synthetic roles
        env:
          PGPASSWORD: synthetic-admin
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f infra/postgres/test-roles.sql
      - name: Verify foundation, durable estimate callbacks and explicit acceptance transactions
        run: pnpm --dir web test:foundation

  agent:
    name: Agent setup checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: agent/.python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install locked Python dependencies
        run: uv sync --project agent --frozen
      - name: Check Python formatting
        run: uv run --project agent black --check --config agent/pyproject.toml agent scripts
      - name: Lint agent
        run: uv run --project agent ruff check agent
      - name: Type-check agent
        run: uv run --project agent pyright --project agent
      - name: Test agent
        run: uv run --project agent pytest agent/tests

  contracts:
    name: Contract validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect contract suites
        id: suites
        shell: bash
        run: |
          if find web/tests/contract -type f -name '*.test.ts' -print -quit 2>/dev/null | grep -q .; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "Web contract suites are not implemented yet; skipping."
          fi
          if find agent/tests/contract -type f -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
          else
            echo "agent=false" >> "$GITHUB_OUTPUT"
            echo "Agent contract suites are not implemented yet; skipping."
          fi
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install locked Node.js dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate contract references and drift
        run: |
          pnpm --dir web agent:contracts:check
          node scripts/validate-contracts.mjs
      - name: Test web contracts
        if: steps.suites.outputs.web == 'true'
        run: pnpm --filter @onholidai/web test:contracts
      - name: Set up Python for agent contracts
        if: steps.suites.outputs.agent == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: agent/.python-version
      - name: Set up uv for agent contracts
        if: steps.suites.outputs.agent == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install locked agent dependencies
        if: steps.suites.outputs.agent == 'true'
        run: uv sync --project agent --frozen
      - name: Test agent contracts
        if: steps.suites.outputs.agent == 'true'
        run: |
          uv run --project agent python agent/scripts/export_contracts.py --check
          uv run --project agent pytest agent/tests/contract

  later-suites:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs: [web, foundation, agent, contracts]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Playwright browser suite
            probe: web/tests/e2e
            probe-type: playwright
            command: pnpm test:e2e
            install-browsers: true
          - name: Temporal workflow suite
            probe: web/tests/integration/booking-workflows.test.ts
            probe-type: file
            command: pnpm --dir web test:temporal
            install-browsers: false
    services:
      postgres:
        # An empty image skips this service for the Temporal matrix entry.
        image: ${{ matrix.install-browsers && 'postgis/postgis:18-3.6' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://onholidai_web:synthetic-web@127.0.0.1:5432/onholidai_e2e
      MIGRATION_DATABASE_URL: postgresql://onholidai_migration:synthetic-migration@127.0.0.1:5432/onholidai_e2e
      PROVIDER_MODE: deterministic
      BETTER_AUTH_URL: https://localhost:3000
      WEB_BASE_URL: https://localhost:3000
      AGENT_BASE_URL: http://127.0.0.1:8000
      BETTER_AUTH_SECRET: browser-test-only-auth-secret-000000000000
      SERVICE_TOKEN_SECRET: browser-test-only-service-secret-000000000
      PRICING_DIAGNOSTIC_SECRET: browser-test-only-pricing-secret-000000000
      LANGSMITH_TRACING: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect implemented capability
        id: capability
        shell: bash
        env:
          PROBE: ${{ matrix.probe }}
          PROBE_TYPE: ${{ matrix.probe-type }}
          SUITE_NAME: ${{ matrix.name }}
        run: |
          available=false
          if [[ "$PROBE_TYPE" == "file" && -f "$PROBE" ]]; then
            available=true
          elif [[ "$PROBE_TYPE" == "playwright" && -d "$PROBE" ]] && find "$PROBE" -type f -name '*.spec.ts' -print -quit | grep -q .; then
            available=true
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"
          if [[ "$available" == "false" ]]; then
            echo "$SUITE_NAME is not implemented yet; skipping."
          fi
      - name: Set up Node.js
        if: steps.capability.outputs.available == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        if: steps.capability.outputs.available == 'true'
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install locked Node.js dependencies
        if: steps.capability.outputs.available == 'true'
        run: pnpm install --frozen-lockfile
      - name: Provision isolated browser database
        if: steps.capability.outputs.available == 'true' && matrix.install-browsers
        env:
          PGPASSWORD: synthetic-admin
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f infra/postgres/test-roles.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE onholidai_e2e OWNER onholidai_migration;
          REVOKE CONNECT ON DATABASE onholidai_e2e FROM PUBLIC;
          GRANT CONNECT ON DATABASE onholidai_e2e TO onholidai_migration, onholidai_web, onholidai_worker;
          SQL
          psql -h 127.0.0.1 -U postgres -d onholidai_e2e -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS postgis"
          pnpm --dir web db:migrate
      - name: Set up Python for browser planning
        if: steps.capability.outputs.available == 'true' && matrix.install-browsers
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: agent/.python-version
      - name: Set up uv for browser planning
        if: steps.capability.outputs.available == 'true' && matrix.install-browsers
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install locked browser agent dependencies
        if: steps.capability.outputs.available == 'true' && matrix.install-browsers
        run: uv sync --project agent --frozen
      - name: Build browser application
        if: steps.capability.outputs.available == 'true' && matrix.install-browsers
        timeout-minutes: 5
        run: pnpm --dir web build
      - name: Create disposable browser TLS certificate
        if: steps.capability.outputs.available == 'true' && matrix.install-browsers
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$RUNNER_TEMP/browser.key" -out "$RUNNER_TEMP/browser.crt"
          openssl pkcs12 -export -inkey "$RUNNER_TEMP/browser.key" \
            -in "$RUNNER_TEMP/browser.crt" -out "$RUNNER_TEMP/browser.pfx" -passout pass:
          echo "PLAYWRIGHT_TLS_CERTIFICATE=$RUNNER_TEMP/browser.pfx" >> "$GITHUB_ENV"
      - name: Install Playwright browsers
        if: steps.capability.outputs.available == 'true' && matrix.install-browsers
        run: pnpm --dir web exec playwright install --with-deps
      - name: Run suite
        if: steps.capability.outputs.available == 'true'
        timeout-minutes: 15
        run: ${{ matrix.command }}
      - name: Upload browser failure diagnostics
        if: failure() && matrix.install-browsers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failures
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 3
