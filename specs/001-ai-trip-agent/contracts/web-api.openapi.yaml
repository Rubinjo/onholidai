openapi: 3.1.0
info:
  title: OnHolid.ai Web and Trip Domain API
  version: 1.0.0
  description: >-
    Browser-facing trip, agent-run, and booking commands plus restricted internal
    read/proposal endpoints. The web domain is the sole authoritative trip writer.
servers:
  - url: /api/v1
security:
  - browserSession: []
tags:
  - name: Trips
  - name: Agent Runs
  - name: Booking
  - name: Internal Agent Tools
paths:
  /places:
    get:
      tags: [Trips]
      operationId: lookupPlaces
      summary: Search bounded geographic candidates for explicit traveller selection
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: countryCode
          in: query
          schema: { type: string, pattern: '^[A-Z]{2}$' }
      responses:
        '200':
          description: Up to twenty candidates; multiple matches require explicit selection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [candidates, ambiguous, source]
                properties:
                  ambiguous: { type: boolean }
                  source: { enum: [synthetic, provider] }
                  candidates:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      additionalProperties: false
                      required: [placeId, kind, name, countryCode, timezone, airportCode, location]
                      properties:
                        placeId: { type: string, minLength: 1, maxLength: 256 }
                        kind: { enum: [country, city, place, airport] }
                        name: { type: string, minLength: 1, maxLength: 120 }
                        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
                        timezone: { type: string }
                        airportCode: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
                        location:
                          oneOf:
                            - type: object
                              additionalProperties: false
                              required: [latitude, longitude]
                              properties:
                                latitude: { type: number, minimum: -90, maximum: 90 }
                                longitude: { type: number, minimum: -180, maximum: 180 }
                            - type: 'null'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: Geographic provider unavailable; preserve current selections
  /trips:
    post:
      tags: [Trips]
      operationId: createTrip
      summary: Create the initial authoritative draft trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Initial trip version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
  /trips/{tripId}:
    get:
      tags: [Trips]
      operationId: getTrip
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Current authorized trip snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{tripId}/conversations:
    get:
      tags: [Trips]
      operationId: listTripConversations
      summary: Read permitted redacted conversation history for the trip
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: after
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
      responses:
        '200':
          description: Authorized redacted conversations and messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{tripId}/versions:
    get:
      tags: [Trips]
      operationId: listTripVersions
      summary: Read inspectable immutable trip versions and their change provenance
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: afterVersion
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Authorized trip version history in ascending version order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripVersionPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{tripId}/commands/edit-preview:
    post:
      tags: [Trips]
      operationId: previewDirectTripEdit
      summary: Compute material impacts without mutating the authoritative trip
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectEditPreviewRequest'
      responses:
        '200':
          description: Reviewable impacts and preview bound to the current version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectEditImpactReview'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /trips/{tripId}/commands/edit:
    post:
      tags: [Trips]
      operationId: applyDirectTripEdit
      summary: Validate a direct UI edit and append a trip version
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripMutationRequest'
      responses:
        '200':
          description: New authoritative snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /trips/{tripId}/proposals/{proposalId}/accept:
    post:
      tags: [Trips]
      operationId: acceptTripProposal
      summary: Accept, validate, and apply a non-transactional proposal
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedCommand'
      responses:
        '200':
          description: Proposal applied as a new trip version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /trips/{tripId}/proposals/{proposalId}/reject:
    post:
      tags: [Trips]
      operationId: rejectTripProposal
      summary: Reject a proposal without changing the authoritative trip
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalRejectionRequest'
      responses:
        '200':
          description: Proposal marked rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeProposal'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  "/trips/{tripId}/commands/undo":
    post:
      tags: ["Trips"]
      operationId: "undoTripVersion"
      parameters:
        -
          $ref: "#/components/parameters/TripId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              additionalProperties: false
              required: ["requestId","expectedVersion","restoreVersion"]
              properties:
                requestId:
                  type: "string"
                  format: "uuid"
                expectedVersion:
                  type: "integer"
                  minimum: 1
                restoreVersion:
                  type: "integer"
                  minimum: 1
      responses:
        "200":
          description: "Prior snapshot restored as a new version"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/TripEnvelope"
        "409":
          $ref: "#/components/responses/VersionConflict"
  /trips/{tripId}/commands/finalize:
    post:
      tags: [Trips]
      operationId: finalizeTrip
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedCommand'
      responses:
        '200':
          description: Finalized trip or blocking feasibility issues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  "/trips/{tripId}/agent-runs":
    post:
      tags: ["Agent Runs"]
      operationId: "startAgentRun"
      parameters:
        -
          $ref: "#/components/parameters/TripId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              additionalProperties: false
              required: ["requestId","baseTripVersion","message","purpose"]
              properties:
                requestId:
                  type: "string"
                  format: "uuid"
                baseTripVersion:
                  type: "integer"
                  minimum: 1
                conversationId:
                  type: ["string","null"]
                  format: "uuid"
                  description: Omit or null for the first run; web creates the owned conversation.
                message:
                  type: "string"
                  minLength: 1
                  maxLength: 12000
                purpose:
                  enum: ["initial_estimate","refinement","finalization"]
      responses:
        "202":
          description: "Agent run accepted"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AgentRun"
        "409":
          $ref: "#/components/responses/VersionConflict"
  /agent-runs/{runId}:
    get:
      tags: [Agent Runs]
      operationId: getAgentRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Durable run status and final result when available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '404':
          $ref: '#/components/responses/NotFound'
  /agent-runs/{runId}/events:
    get:
      tags: [Agent Runs]
      operationId: streamAgentRunEvents
      summary: Replay and follow typed run events
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: >-
            SSE stream. Each data field is an AgentEvent JSON object; event IDs are
            monotonic cursors and Last-Event-ID may resume delivery.
          content:
            text/event-stream:
              schema:
                type: string
              x-sse-event-schema:
                $ref: '#/components/schemas/AgentEvent'
              x-internal-event-schema:
                $ref: './agent-api.openapi.yaml#/components/schemas/AgentEvent'
  /agent-runs/{runId}/clarifications:
    post:
      tags: [Agent Runs]
      operationId: forwardAgentClarification
      summary: Resume a suspended run with the traveller's focused clarification
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarificationForwardRequest'
      responses:
        '200':
          description: Clarification durably recorded and run resumed under its original request identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '409':
          description: Run is not awaiting this clarification or request identity conflicts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /trips/{tripId}/booking/revalidations:
    post:
      tags: [Booking]
      operationId: startBookingRevalidation
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedCommand'
      responses:
        '202':
          description: Revalidation workflow accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowReference'
        '409':
          $ref: '#/components/responses/VersionConflict'
  /trips/{tripId}/booking/authorizations:
    post:
      tags: [Booking]
      operationId: authorizeBookingTerms
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingAuthorizationRequest'
      responses:
        '201':
          description: Exact current terms authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingAuthorization'
        '409':
          description: Terms expired, changed, or trip version no longer current
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /trips/{tripId}/bookings:
    post:
      tags: [Booking]
      operationId: startBooking
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, authorizationId]
              properties:
                requestId:
                  type: string
                  format: uuid
                authorizationId:
                  type: string
                  format: uuid
      responses:
        '202':
          description: Idempotent booking workflow accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingTransaction'
        '409':
          description: Authorization is invalid, expired, consumed, or stale
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /booking/revalidations/{workflowId}:
    get:
      tags: [Booking]
      operationId: getBookingRevalidation
      summary: Read durable revalidation status and immutable customer-safe terms
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          description: Current workflow status and terms when revalidation is complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevalidationReview'
        '404':
          $ref: '#/components/responses/NotFound'
  /bookings/{bookingId}:
    get:
      tags: [Booking]
      operationId: getBooking
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Durable transaction and per-component outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingTransaction'
        '404':
          $ref: '#/components/responses/NotFound'
  /bookings/{bookingId}/components/{componentId}/reschedule-revalidations:
    post:
      tags: [Booking]
      operationId: startComponentRescheduleRevalidation
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: componentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRevalidationRequest'
      responses:
        '202':
          description: Independent rescheduling revalidation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowReference'
        '409':
          description: Component is not eligible or has an unresolved consequential write
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /bookings/{bookingId}/components/{componentId}/recovery:
    post:
      tags: [Booking]
      operationId: recoverBookingComponent
      summary: Reconcile first, then perform only an explicitly safe eligible retry
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/ComponentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentRecoveryRequest'
      responses:
        '202':
          description: Recovery workflow accepted or prior durable result replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingTransaction'
        '409':
          description: Retry is unsafe, unauthorized, expired, or conflicts with an in-flight claim
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /bookings/{bookingId}/components/{componentId}/cancellations:
    post:
      tags: [Booking]
      operationId: cancelBookingComponent
      summary: Execute a separately authorized component cancellation
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/ComponentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizedComponentCommand'
      responses:
        '202':
          description: Cancellation workflow accepted or prior durable result replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingTransaction'
        '409':
          description: Cancellation authorization is stale, expired, consumed, or mismatched
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /bookings/{bookingId}/components/{componentId}/reschedule-authorizations:
    post:
      tags: [Booking]
      operationId: authorizeComponentReschedule
      summary: Authorize exact freshly revalidated terms for one component reschedule
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/ComponentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleAuthorizationRequest'
      responses:
        '201':
          description: Exact component reschedule terms authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingAuthorization'
        '409':
          description: Revalidated terms changed, expired, or do not match this component
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /bookings/{bookingId}/components/{componentId}/reschedules:
    post:
      tags: [Booking]
      operationId: rescheduleBookingComponent
      summary: Execute an authorized reschedule without changing unrelated components
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/ComponentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizedComponentCommand'
      responses:
        '202':
          description: Reschedule workflow accepted or prior durable result replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingTransaction'
        '409':
          description: Reschedule authorization is stale, expired, consumed, or mismatched
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/trips/{tripId}/agent-view:
    get:
      tags: [Internal Agent Tools]
      operationId: getTripAgentView
      security:
        - internalService: []
      parameters:
        - name: x-user-id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: x-request-id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/TripId'
        - name: baseTripVersion
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: detail
          in: query
          required: true
          schema:
            enum: [compact, itinerary, components, pricing, constraints]
      responses:
        '200':
          description: Authorized bounded trip projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '409':
          $ref: '#/components/responses/VersionConflict'
  /internal/pricing/{tripId}:
    get:
      tags: [Internal Agent Tools]
      operationId: getTripPricingDiagnostic
      summary: Inspect supplier cost, margin, customer price, and calculation totals
      security:
        - internalService: []
      x-required-roles: [pricing_auditor, administrator]
      parameters:
        - name: x-user-id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: x-request-id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: x-base-trip-version
          in: header
          description: Required when the version query parameter is omitted; must match the scoped token.
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/TripId'
        - name: version
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Role-restricted internal pricing calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingDiagnostic'
        '403':
          description: Authenticated actor lacks an allowed pricing role
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/trips/{tripId}/proposals:
    post:
      tags: [Internal Agent Tools]
      operationId: recordTripProposal
      security:
        - internalService: []
      parameters:
        - name: x-user-id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: x-request-id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './agent-api.openapi.yaml#/components/schemas/ChangeProposal'
      responses:
        '201':
          description: Proposal recorded without applying it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeProposal'
        '422':
          $ref: '#/components/responses/ValidationError'
  /internal/context/search:
    post:
      tags: [Internal Agent Tools]
      operationId: retrieveRelevantContext
      security:
        - internalService: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tripId, userId, query, reason, limit]
              properties:
                tripId:
                  type: string
                  format: uuid
                userId:
                  type: string
                  format: uuid
                query:
                  type: string
                  minLength: 1
                  maxLength: 500
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                limit:
                  type: integer
                  minimum: 1
                  maximum: 20
      responses:
        '200':
          description: Redacted, bounded historical context
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      additionalProperties: false
                      required: [kind, content, occurredAt]
                      properties:
                        kind:
                          enum: [message, decision, rejected_option, constraint, open_question]
                        content:
                          type: string
                        occurredAt:
                          type: string
                          format: date-time
  "/internal/agent-runs/{runId}/events/{cursor}":
    put:
      tags: ["Internal Agent Tools"]
      operationId: "persistAgentRunEvent"
      summary: "Commit scoped durable agent event and return its idempotent receipt"
      security:
        -
          internalService: []
      x-required-scope: "run:write"
      x-service-audience: "web"
      x-run-binding: true
      parameters:
        -
          $ref: "#/components/parameters/RunId"
        -
          name: "cursor"
          in: "path"
          required: true
          schema:
            type: "integer"
            minimum: 1
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/PersistAgentEventRequest"
      responses:
        "200":
          description: "Durable record committed, or original receipt for exact replay"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AgentPersistenceReceipt"
        "401":
          description: "Missing, invalid, expired or wrong-audience credential"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "Run/user/trip/request binding or scope mismatch"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Cursor gap, conflicting fingerprint, stale terminal state or unmatched result event"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"
  "/internal/agent-runs/{runId}/result":
    put:
      tags: ["Internal Agent Tools"]
      operationId: "persistAgentRunResult"
      summary: "Commit scoped durable agent result and return its idempotent receipt"
      security:
        -
          internalService: []
      x-required-scope: "run:write"
      x-service-audience: "web"
      x-run-binding: true
      parameters:
        -
          $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/PersistAgentResultRequest"
      responses:
        "200":
          description: "Durable record committed, or original receipt for exact replay"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AgentPersistenceReceipt"
        "401":
          description: "Missing, invalid, expired or wrong-audience credential"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "Run/user/trip/request binding or scope mismatch"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Cursor gap, conflicting fingerprint, stale terminal state or unmatched result event"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"
  /internal/agent-runs/{runId}:
    get:
      operationId: readDurableInternalRun
      security: [{internalService: []}]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/InternalUserId'
        - $ref: '#/components/parameters/InternalRequestId'
      responses:
        '200':
          description: Scoped durable status; never restarts research
          content:
            application/json:
              schema:
                $ref: './agent-api.openapi.yaml#/components/schemas/AgentRun'
  /internal/agent-runs/{runId}/validate:
    post:
      operationId: bindReservedAgentDispatch
      security: [{internalService: []}]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/InternalUserId'
        - $ref: '#/components/parameters/InternalRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './agent-api.openapi.yaml#/components/schemas/CreateAgentRunRequest'
      responses:
        '200':
          description: Fingerprint matches the reservation and original dispatch
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accepted]
                properties:
                  accepted: {const: true}
        '409':
          $ref: '#/components/responses/VersionConflict'
  /internal/agent-runs/{runId}/events:
    get:
      operationId: replayDurableInternalEvents
      security: [{internalService: []}]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/InternalUserId'
        - $ref: '#/components/parameters/InternalRequestId'
        - in: query
          name: after
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Recorded contiguous events only
          content:
            application/json:
              schema:
                type: array
                maxItems: 256
                items:
                  $ref: './agent-api.openapi.yaml#/components/schemas/AgentEvent'
  /internal/agent-runs/{runId}/resumes/{questionId}:
    get:
      operationId: readDurableResumeReceipt
      security: [{internalService: []}]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/InternalUserId'
        - $ref: '#/components/parameters/InternalRequestId'
        - in: path
          name: questionId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Scoped clarification fingerprint and pre-dispatch cursor
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [fingerprint, eventCursor]
                properties:
                  fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
                  eventCursor: {type: integer, minimum: 0}
  /internal/trips/{tripId}/planning-search:
    post:
      operationId: searchScopedPlanningOffers
      security: [{internalService: []}]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/InternalUserId'
        - $ref: '#/components/parameters/InternalRequestId'
        - in: header
          name: x-base-trip-version
          required: true
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [startDate, endDate, destinationIds]
              properties:
                startDate: {type: string, format: date}
                endDate: {type: string, format: date}
                destinationIds:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items: {type: string, format: uuid}
      responses:
        '200':
          description: Customer-price projected, unbooked planning offers. Internal costs remain in web-owned records.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [offers, outcomes]
                properties:
                  offers: {type: array, maxItems: 32, items: {type: object}}
                  outcomes: {type: array, maxItems: 4, items: {type: object}}
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: onholidai.session
    internalService:
      type: http
      scheme: bearer
      bearerFormat: short-lived service token
  parameters:
    InternalUserId:
      name: x-user-id
      in: header
      required: true
      schema: {type: string, format: uuid}
    InternalRequestId:
      name: x-request-id
      in: header
      required: true
      schema: {type: string, format: uuid}
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ComponentId:
      name: componentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: Input or domain validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    VersionConflict:
      description: "Expected trip version is stale"
      content:
        "application/problem+json":
          schema:
            type: "object"
            additionalProperties: false
            required: ["type","title","status","code","correlationId","currentVersion"]
            properties:
              type:
                type: "string"
                format: "uri-reference"
              title:
                type: "string"
              status:
                type: "integer"
                minimum: 400
                maximum: 599
              code:
                type: "string"
              detail:
                type: "string"
              correlationId:
                type: "string"
              currentVersion:
                type: "integer"
                minimum: 1
    NotFound:
      description: Resource not found or not visible to the actor
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    DepartureOrigin:
      type: "object"
      additionalProperties: false
      required: ["kind","placeId","name","countryCode","timezone","airportCode","confirmedByUser"]
      properties:
        kind:
          enum: ["city","airport"]
        placeId:
          type: "string"
          minLength: 1
        name:
          type: "string"
          minLength: 1
          maxLength: 120
        countryCode:
          type: "string"
          pattern: "^[A-Z]{2}$"
        timezone:
          type: "string"
          minLength: 1
          description: "Valid IANA timezone; domain validates registry membership."
        airportCode:
          type: ["string","null"]
          pattern: "^[A-Z]{3}$"
        confirmedByUser:
          const: true
      allOf:
        -
          if:
            properties:
              kind:
                const: "airport"
          then:
            properties:
              airportCode:
                type: "string"
                pattern: "^[A-Z]{3}$"
          else:
            properties:
              airportCode:
                type: "null"
    EstimatedCostRange:
      type: "object"
      additionalProperties: false
      required: ["currency","minimumMinor","maximumMinor"]
      properties:
        currency:
          type: "string"
          pattern: "^[A-Z]{3}$"
        minimumMinor:
          type: "integer"
          minimum: 0
        maximumMinor:
          type: "integer"
          minimum: 0
          description: "Domain validates maximumMinor >= minimumMinor and the preview's currency."
    BookingExecutionBasis:
      type: "object"
      additionalProperties: false
      description: "Customer-safe reference to immutable approved terms; never includes internal supplier pricing or sensitive execution inputs."
      required: ["tripVersion","termsHash","expiresAt"]
      properties:
        tripVersion:
          type: "integer"
          minimum: 1
        termsHash:
          type: "string"
          minLength: 32
          maxLength: 256
        expiresAt:
          type: "string"
          format: "date-time"
    PersistAgentEventRequest:
      $ref: './agent-api.openapi.yaml#/components/schemas/PersistAgentEventRequest'
    PersistAgentResultRequest:
      $ref: './agent-api.openapi.yaml#/components/schemas/PersistAgentResultRequest'
    AgentPersistenceReceipt:
      $ref: './agent-api.openapi.yaml#/components/schemas/AgentPersistenceReceipt'
    CreateTripRequest:
      type: "object"
      additionalProperties: false
      required: ["requestId","title","currency","snapshot"]
      properties:
        requestId:
          type: "string"
          format: "uuid"
        title:
          type: "string"
          minLength: 1
          maxLength: 120
        currency:
          type: "string"
          pattern: "^[A-Z]{3}$"
        snapshot:
          $ref: "#/components/schemas/TripSnapshot"
    VersionedCommand:
      type: "object"
      additionalProperties: false
      required: ["requestId","expectedVersion"]
      properties:
        requestId:
          type: "string"
          format: "uuid"
        expectedVersion:
          type: "integer"
          minimum: 1
    TripMutationRequest:
      type: "object"
      additionalProperties: false
      required: ["requestId","expectedVersion","impactFingerprint","operations"]
      properties:
        requestId:
          type: "string"
          format: "uuid"
        expectedVersion:
          type: "integer"
          minimum: 1
        impactFingerprint:
          type: "string"
          minLength: 32
          maxLength: 256
        operations:
          type: "array"
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/DraftOperation"
    DirectEditPreviewRequest:
      type: object
      additionalProperties: false
      required: [requestId, expectedVersion, operations]
      properties:
        requestId:
          type: string
          format: uuid
        expectedVersion:
          type: integer
          minimum: 1
        operations:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/DraftOperation'
    DirectEditImpactReview:
      type: object
      additionalProperties: false
      required: [reviewId, impactFingerprint, tripId, baseTripVersion, operations, affectedFacts, impacts, previewSnapshot, expiresAt]
      properties:
        reviewId:
          type: string
          format: uuid
        impactFingerprint:
          type: string
          minLength: 32
          maxLength: 256
        tripId:
          type: string
          format: uuid
        baseTripVersion:
          type: integer
          minimum: 1
        operations:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/DraftOperation'
        affectedFacts:
          type: array
          minItems: 1
          items:
            type: string
        impacts:
          $ref: '#/components/schemas/TripImpact'
        previewSnapshot:
          $ref: '#/components/schemas/TripSnapshot'
        expiresAt:
          type: string
          format: date-time
    TripImpact:
      type: object
      additionalProperties: false
      required: [route, dates, transport, stays, activities, availability, constraints, schedule, price]
      properties:
        route:
          type: array
          items: { type: string }
        dates:
          type: array
          items: { type: string }
        transport:
          type: array
          items: { type: string }
        stays:
          type: array
          items: { type: string }
        activities:
          type: array
          items: { type: string }
        availability:
          type: array
          items: { type: string }
        constraints:
          type: array
          items: { type: string }
        schedule:
          type: array
          items: { type: string }
        price:
          $ref: '#/components/schemas/PriceImpact'
    PriceImpact:
      type: object
      additionalProperties: false
      required: [currency, beforeMinor, afterMinor, deltaMinor]
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        beforeMinor:
          type: integer
          minimum: 0
        afterMinor:
          type: integer
          minimum: 0
        deltaMinor:
          type: integer
    ProposalRejectionRequest:
      type: object
      additionalProperties: false
      required: [requestId, expectedVersion]
      properties:
        requestId:
          type: string
          format: uuid
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 500
    DraftOperation:
      type: "object"
      additionalProperties: false
      required: ["operation","target","value"]
      properties:
        operation:
          enum: ["add","replace","remove","reorder"]
        target:
          type: "string"
          pattern: "^/(departureOrigin|availabilityWindows|duration|travellerParty|preferences|constraints|destinations|itineraryDays|components)(/.*)?$"
        value: {}
    TripEnvelope:
      type: "object"
      additionalProperties: false
      required: ["tripId","version","lifecycleState","snapshot","updatedAt"]
      properties:
        tripId:
          type: "string"
          format: "uuid"
        version:
          type: "integer"
          minimum: 1
        lifecycleState:
          enum: ["draft","finalized","partially_booked","booked","cancelled"]
        snapshot:
          $ref: "#/components/schemas/TripSnapshot"
        updatedAt:
          type: "string"
          format: "date-time"
    TripSnapshot:
      type: "object"
      additionalProperties: false
      required: ["departureOrigin","availabilityWindows","duration","travellerParty","preferences","constraints","destinations","itineraryDays","components","price","warnings"]
      properties:
        availabilityWindows:
          type: "array"
          minItems: 1
          items:
            type: "object"
            additionalProperties: true
        duration:
          type: "object"
          required: ["minimumDays","idealDays","maximumDays"]
          properties:
            minimumDays:
              type: "integer"
              minimum: 1
            idealDays:
              type: "integer"
              minimum: 1
            maximumDays:
              type: "integer"
              minimum: 1
        travellerParty:
          type: "object"
          additionalProperties: true
        preferences:
          type: "object"
          additionalProperties: true
        constraints:
          type: "array"
          items:
            type: "object"
            additionalProperties: true
        destinations:
          type: "array"
          minItems: 1
          maxItems: 8
          items:
            type: "object"
            additionalProperties: true
        itineraryDays:
          type: "array"
          items:
            type: "object"
            additionalProperties: true
        components:
          type: "array"
          maxItems: 32
          items:
            type: "object"
            additionalProperties: true
        price:
          $ref: "#/components/schemas/PublicPrice"
        warnings:
          type: "array"
          items:
            type: "object"
            additionalProperties: true
        departureOrigin:
          description: "Resolved traveller-confirmed origin for estimation. Null is a legacy/draft read projection that blocks flight estimation until explicitly confirmed."
          oneOf:
            -
              $ref: "#/components/schemas/DepartureOrigin"
            -
              type: "null"
    PublicPrice:
      type: "object"
      description: "Customer projection intentionally excludes supplier amount and platform margin."
      additionalProperties: false
      required: ["currency","finalCustomerMinor","status","checkedAt"]
      properties:
        currency:
          type: "string"
          pattern: "^[A-Z]{3}$"
        finalCustomerMinor:
          type: "integer"
          minimum: 0
        taxesMinor:
          type: "integer"
          minimum: 0
        feesMinor:
          type: "integer"
          minimum: 0
        status:
          enum: ["estimated","quoted","live","expired","confirmed"]
        checkedAt:
          type: "string"
          format: "date-time"
        expiresAt:
          type: ["string","null"]
          format: "date-time"
    ChangeProposal:
      type: "object"
      additionalProperties: false
      required: ["id","purpose","initiatingRequestId","tripId","agentRunId","baseTripVersion","operations","affectedFacts","rationale","status","createdAt","expiresAt"]
      properties:
        id:
          type: "string"
          format: "uuid"
        tripId:
          type: "string"
          format: "uuid"
        agentRunId:
          type: "string"
          format: "uuid"
        baseTripVersion:
          type: "integer"
          minimum: 1
        operations:
          type: "array"
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/DraftOperation"
        affectedFacts:
          type: "array"
          items:
            type: "string"
        rationale:
          type: "string"
        tradeoffs:
          type: "array"
          items:
            type: "string"
        ambiguities:
          type: "array"
          items:
            type: "string"
        status:
          enum: ["proposed","needs_clarification","accepted","applied","rejected","stale"]
        createdAt:
          type: "string"
          format: "date-time"
        expiresAt:
          type: "string"
          format: "date-time"
        purpose:
          enum: ["initial_estimate","refinement","finalization"]
        initiatingRequestId:
          type: "string"
          format: "uuid"
        previewSnapshot:
          $ref: "#/components/schemas/TripSnapshot"
        estimatedCostRange:
          $ref: "#/components/schemas/EstimatedCostRange"
        styleCompatibility:
          type: "string"
          minLength: 1
        constraintSummary:
          type: "array"
          items:
            type: "string"
        warnings:
          type: "array"
          items:
            type: "string"
      allOf:
        -
          if:
            properties:
              purpose:
                const: "initial_estimate"
          then:
            required: ["previewSnapshot","estimatedCostRange","styleCompatibility","constraintSummary","warnings"]
    AgentRun:
      type: "object"
      additionalProperties: false
      required: ["id","requestId","tripId","conversationId","purpose","baseTripVersion","status","nextEventCursor","leaseExpiresAt","lastDurableProgressAt","interruptionReason","createdAt"]
      properties:
        id:
          type: "string"
          format: "uuid"
        requestId:
          type: "string"
          format: "uuid"
        tripId:
          type: "string"
          format: "uuid"
        conversationId:
          type: "string"
          format: "uuid"
        purpose:
          enum: ["initial_estimate","refinement","finalization"]
        baseTripVersion:
          type: "integer"
          minimum: 1
        status:
          enum: ["queued","running","awaiting_clarification","proposed","completed","failed","cancelled"]
        result:
          oneOf:
            -
              $ref: "#/components/schemas/PublicAgentResult"
            -
              type: "null"
        nextEventCursor:
          type: "integer"
          minimum: 0
        leaseExpiresAt:
          type: ["string","null"]
          format: "date-time"
          description: "Queued/running lease expires after 90 seconds and is suspended while awaiting clarification."
        lastDurableProgressAt:
          type: ["string","null"]
          format: "date-time"
          description: "Durably persisted progress renews the lease at least every 15 seconds."
        interruptionReason:
          type: ["string","null"]
          enum: ["lease_expired",null]
        createdAt:
          type: "string"
          format: "date-time"
        completedAt:
          type: ["string","null"]
          format: "date-time"
    ClarificationForwardRequest:
      $ref: './agent-api.openapi.yaml#/components/schemas/AnswerClarificationRequest'
    PublicAgentResult:
      oneOf:
        - $ref: './agent-api.openapi.yaml#/components/schemas/AnswerResult'
        - $ref: './agent-api.openapi.yaml#/components/schemas/ClarificationResult'
        - type: object
          additionalProperties: false
          required: [kind, message, proposal]
          properties:
            kind:
              const: proposal
            message:
              type: string
              minLength: 1
              maxLength: 12000
            proposal:
              $ref: '#/components/schemas/ChangeProposal'
    AgentEvent:
      type: "object"
      additionalProperties: false
      description: >-
        Public SSE envelope translated from the internal typed event only after its
        durable receipt. Identity fields are preserved and variant fields move under
        payload; proposals are loaded from the web repository and customer-price projected.
      required: ["version","runId","cursor","type","occurredAt","payload"]
      properties:
        version:
          const: "1"
        runId:
          type: "string"
          format: "uuid"
        cursor:
          type: "integer"
          minimum: 1
        type:
          enum: ["progress","clarification","proposal","completed","failed"]
        occurredAt:
          type: "string"
          format: "date-time"
        payload:
          type: "object"
          additionalProperties: true
    ConversationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        nextCursor:
          type: [string, 'null']
          maxLength: 256
    Conversation:
      type: object
      additionalProperties: false
      required: [id, tripId, messages, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConversationMessage:
      type: object
      additionalProperties: false
      required: [id, role, content, tripVersion, createdAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          enum: [user, assistant, system]
        content:
          type: string
          maxLength: 12000
          description: Redacted permitted content only.
        tripVersion:
          type: [integer, 'null']
          minimum: 1
        agentRunId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
    TripVersionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TripVersionSummary'
    TripVersionSummary:
      type: object
      additionalProperties: false
      required: [version, initiatingActor, initiatingRequestId, affectedFacts, reversible, snapshot, createdAt]
      properties:
        version:
          type: integer
          minimum: 1
        initiatingActor:
          enum: [user, agent_proposal, system_revalidation, booking_workflow]
        initiatingRequestId:
          type: string
          format: uuid
        affectedFacts:
          type: array
          items: { type: string }
        reversible:
          type: boolean
        reversedFromVersion:
          type: [integer, 'null']
          minimum: 1
        snapshot:
          $ref: '#/components/schemas/TripSnapshot'
        createdAt:
          type: string
          format: date-time
    PricingDiagnostic:
      type: object
      additionalProperties: false
      required: [tripId, tripVersion, currency, components, totals, calculatedAt]
      properties:
        tripId:
          type: string
          format: uuid
        tripVersion:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        components:
          type: array
          items:
            $ref: '#/components/schemas/PricingDiagnosticLine'
        totals:
          $ref: '#/components/schemas/PricingDiagnosticAmounts'
        calculatedAt:
          type: string
          format: date-time
    PricingDiagnosticLine:
      type: object
      additionalProperties: false
      required: [componentId, supplierMinor, marginMinor, taxesMinor, feesMinor, finalCustomerMinor]
      properties:
        componentId:
          type: string
          format: uuid
        supplierMinor:
          type: integer
          minimum: 0
        marginMinor:
          type: integer
          minimum: 0
        taxesMinor:
          type: integer
          minimum: 0
        feesMinor:
          type: integer
          minimum: 0
        finalCustomerMinor:
          type: integer
          minimum: 0
    PricingDiagnosticAmounts:
      type: object
      additionalProperties: false
      required: [supplierMinor, marginMinor, taxesMinor, feesMinor, finalCustomerMinor]
      properties:
        supplierMinor:
          type: integer
          minimum: 0
        marginMinor:
          type: integer
          minimum: 0
        taxesMinor:
          type: integer
          minimum: 0
        feesMinor:
          type: integer
          minimum: 0
        finalCustomerMinor:
          type: integer
          minimum: 0
    WorkflowReference:
      type: "object"
      additionalProperties: false
      required: ["workflowId","status"]
      properties:
        workflowId:
          type: "string"
        status:
          enum: ["accepted","running"]
    BookingAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [requestId, tripVersion, termsHash, operation, componentId, acknowledgedNonReversibleActions]
      properties:
        requestId:
          type: string
          format: uuid
        tripVersion:
          type: integer
          minimum: 1
        termsHash:
          type: string
          minLength: 32
          maxLength: 256
        operation:
          enum: [book_trip, cancel_component]
        componentId:
          type: [string, 'null']
          format: uuid
          description: Required by the domain for cancel_component and null for book_trip.
        acknowledgedNonReversibleActions:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    RescheduleRevalidationRequest:
      type: object
      additionalProperties: false
      required: [requestId, requestedChange]
      properties:
        requestId:
          type: string
          format: uuid
        requestedChange:
          $ref: '#/components/schemas/RequestedComponentChange'
    RequestedComponentChange:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        serviceStart:
          type: string
          format: date-time
        serviceEnd:
          type: string
          format: date-time
        supplierOfferId:
          type: string
          minLength: 1
          maxLength: 256
        travellerIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        note:
          type: string
          maxLength: 500
    RescheduleAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [requestId, revalidationId, tripVersion, termsHash, acknowledgedNonReversibleActions]
      properties:
        requestId:
          type: string
          format: uuid
        revalidationId:
          type: string
          minLength: 1
          maxLength: 256
        tripVersion:
          type: integer
          minimum: 1
        termsHash:
          type: string
          minLength: 32
          maxLength: 256
        acknowledgedNonReversibleActions:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    AuthorizedComponentCommand:
      type: object
      additionalProperties: false
      required: [requestId, authorizationId]
      properties:
        requestId:
          type: string
          format: uuid
        authorizationId:
          type: string
          format: uuid
    ComponentRecoveryRequest:
      type: object
      additionalProperties: false
      required: [requestId, action, authorizationId]
      properties:
        requestId:
          type: string
          format: uuid
        action:
          enum: [status_check, retry]
        authorizationId:
          type: [string, 'null']
          format: uuid
          description: Required by the domain only for a separately authorized retry.
    RevalidationReview:
      type: object
      additionalProperties: false
      required: [workflowId, tripId, tripVersion, status, outcomes, termsHash, terms, expiresAt]
      properties:
        workflowId:
          type: string
        tripId:
          type: string
          format: uuid
        tripVersion:
          type: integer
          minimum: 1
        status:
          enum: [accepted, running, completed, failed]
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/RevalidationComponentOutcome'
        termsHash:
          type: [string, 'null']
          minLength: 32
          maxLength: 256
        terms:
          oneOf:
            - $ref: '#/components/schemas/RevalidatedTerms'
            - type: 'null'
        expiresAt:
          type: [string, 'null']
          format: date-time
    RevalidationComponentOutcome:
      type: object
      additionalProperties: false
      required: [componentId, outcome, terms]
      properties:
        componentId:
          type: string
          format: uuid
        outcome:
          enum: [unchanged, changed, unavailable, unknown]
        terms:
          oneOf:
            - $ref: '#/components/schemas/RevalidatedComponentTerms'
            - type: 'null'
        safeReason:
          type: [string, 'null']
          maxLength: 500
    RevalidatedTerms:
      type: object
      additionalProperties: false
      required: [departureOrigin, travellerParty, components, totalPrice, nonReversibleActions]
      properties:
        departureOrigin:
          $ref: '#/components/schemas/DepartureOrigin'
        travellerParty:
          type: object
          additionalProperties: true
        components:
          type: array
          items:
            $ref: '#/components/schemas/RevalidatedComponentTerms'
        totalPrice:
          $ref: '#/components/schemas/PublicPrice'
        nonReversibleActions:
          type: array
          items:
            type: string
            format: uuid
    RevalidatedComponentTerms:
      type: object
      additionalProperties: false
      required: [componentId, supplierOfferId, inventoryId, serviceStart, serviceEnd, travellerIds, finalCustomerMinor, currency, cancellationTerms, checkedAt, expiresAt]
      properties:
        componentId:
          type: string
          format: uuid
        supplierOfferId:
          type: string
          minLength: 1
        inventoryId:
          type: string
          minLength: 1
        serviceStart:
          type: string
          format: date-time
        serviceEnd:
          type: string
          format: date-time
        travellerIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        finalCustomerMinor:
          type: integer
          minimum: 0
        taxesMinor:
          type: integer
          minimum: 0
        feesMinor:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        cancellationTerms:
          type: string
          minLength: 1
        checkedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    BookingAuthorization:
      type: "object"
      additionalProperties: false
      required: ["id","tripId","tripVersion","termsHash","operation","componentId","status","authorizedAt","expiresAt"]
      properties:
        id:
          type: "string"
          format: "uuid"
        tripId:
          type: "string"
          format: "uuid"
        tripVersion:
          type: "integer"
          minimum: 1
        termsHash:
          type: "string"
        operation:
          enum: ["book_trip","reschedule_component","cancel_component"]
        componentId:
          type: ["string","null"]
          format: "uuid"
        status:
          enum: ["pending","authorized","invalidated","expired","consumed"]
        authorizedAt:
          type: "string"
          format: "date-time"
        expiresAt:
          type: "string"
          format: "date-time"
    BookingTransaction:
      type: "object"
      additionalProperties: false
      required: ["id","tripId","authorizationId","operation","status","components","startedAt","executionBasis","lastObservedTripVersion","executionStatus"]
      properties:
        id:
          type: "string"
          format: "uuid"
        tripId:
          type: "string"
          format: "uuid"
        authorizationId:
          type: "string"
          format: "uuid"
        operation:
          enum: ["book_trip","reschedule_component","cancel_component"]
        status:
          enum: ["requested","running","partially_confirmed","confirmed","action_required","failed","cancelled"]
        components:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required: ["componentId","status"]
            properties:
              componentId:
                type: "string"
                format: "uuid"
              status:
                enum: ["proposed","authorized","booking","confirmed","failed","unknown","action_required","cancelled"]
              providerReference:
                type: ["string","null"]
        startedAt:
          type: "string"
          format: "date-time"
        completedAt:
          type: ["string","null"]
          format: "date-time"
        executionBasis:
          $ref: "#/components/schemas/BookingExecutionBasis"
        lastObservedTripVersion:
          type: "integer"
          minimum: 1
        executionStatus:
          enum: ["active","invalidated","expired","completed"]
    Problem:
      type: "object"
      additionalProperties: false
      required: ["type","title","status","code","correlationId"]
      properties:
        type:
          type: "string"
          format: "uri-reference"
        title:
          type: "string"
        status:
          type: "integer"
          minimum: 400
          maximum: 599
        code:
          type: "string"
        detail:
          type: "string"
        correlationId:
          type: "string"
