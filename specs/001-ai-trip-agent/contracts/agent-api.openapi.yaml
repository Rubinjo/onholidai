openapi: 3.1.0
info:
  title: OnHolid.ai Internal Agent API
  version: 1.0.0
  description: >-
    Internal FastAPI boundary for LangGraph runs. This API reads bounded context
    and emits recommendations or proposals; it never mutates trips or executes transactions.
servers:
  - url: http://agent:8000/internal/v1
security:
  - internalService: []
paths:
  /agent-runs:
    post:
      operationId: createAgentRun
      summary: Start an idempotent agent run against an exact trip version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRunRequest'
      responses:
        '202':
          description: Run accepted or prior result returned for the same request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Reused request ID with different content or stale base version
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /agent-runs/{runId}:
    get:
      operationId: getAgentRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Durable status and typed final result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '404':
          $ref: '#/components/responses/NotFound'
  /agent-runs/{runId}/events:
    get:
      operationId: streamAgentRunEvents
      summary: Replay and follow versioned run events
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: >-
            SSE stream with monotonically increasing event IDs. Last-Event-ID or
            `after` resumes without rerunning tools.
          content:
            text/event-stream:
              schema:
                type: string
              x-sse-event-schema:
                $ref: '#/components/schemas/AgentEvent'
  /agent-runs/{runId}/clarifications:
    post:
      operationId: answerClarification
      summary: Resume a run with a user's answer to the current focused question
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, questionId, answer]
              properties:
                requestId:
                  type: string
                  format: uuid
                questionId:
                  type: string
                  format: uuid
                answer:
                  type: string
                  minLength: 1
                  maxLength: 4000
      responses:
        '202':
          description: Run resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '409':
          description: Question is stale or already answered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    internalService:
      type: http
      scheme: bearer
      bearerFormat: short-lived service token
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing, invalid, expired, or insufficient service credential
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Run not found within the actor scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Contract or safe-domain validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CreateAgentRunRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, actor, requestId, conversationId, message, context]
      properties:
        contractVersion:
          const: '1'
        actor:
          $ref: '#/components/schemas/ActorContext'
        requestId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        message:
          type: string
          minLength: 1
          maxLength: 12000
        context:
          $ref: '#/components/schemas/PromptContext'
    ActorContext:
      type: object
      additionalProperties: false
      required: [userId, tripId, baseTripVersion, scopes]
      properties:
        userId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        baseTripVersion:
          type: integer
          minimum: 1
        scopes:
          type: array
          items:
            enum: [trip:read, context:read, proposal:create]
          allOf:
            - contains:
                const: trip:read
            - contains:
                const: proposal:create
    PromptContext:
      type: object
      additionalProperties: false
      required: [tripSummary, conversationSummary, recentMessages, contextBudget]
      properties:
        tripSummary:
          type: object
          description: Compact authoritative projection at baseTripVersion.
          additionalProperties: true
        conversationSummary:
          $ref: '#/components/schemas/ConversationSummary'
        recentMessages:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ContextMessage'
        contextBudget:
          type: object
          additionalProperties: false
          required: [maximumTokens, compactionThresholdPercent]
          properties:
            maximumTokens:
              type: integer
              minimum: 1000
            compactionThresholdPercent:
              type: integer
              minimum: 1
              maximum: 100
              const: 70
    ConversationSummary:
      type: object
      additionalProperties: false
      required: [constraints, preferences, decisions, rejectedOptions, openQuestions, sourceTripVersion]
      properties:
        constraints:
          type: array
          items:
            type: string
        preferences:
          type: array
          items:
            type: string
        decisions:
          type: array
          items:
            type: string
        rejectedOptions:
          type: array
          items:
            type: string
        openQuestions:
          type: array
          items:
            type: string
        sourceTripVersion:
          type: integer
          minimum: 1
    ContextMessage:
      type: object
      additionalProperties: false
      required: [id, role, redactedContent, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          enum: [user, assistant, system]
        redactedContent:
          type: string
        occurredAt:
          type: string
          format: date-time
    AgentRun:
      type: object
      additionalProperties: false
      required: [id, requestId, tripId, baseTripVersion, status, nextEventCursor, createdAt]
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        baseTripVersion:
          type: integer
          minimum: 1
        status:
          enum: [queued, running, awaiting_clarification, proposed, completed, failed, cancelled]
        result:
          oneOf:
            - $ref: '#/components/schemas/AgentResult'
            - type: 'null'
        nextEventCursor:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
    AgentResult:
      type: object
      additionalProperties: false
      required: [kind, message]
      properties:
        kind:
          enum: [answer, clarification, proposal]
        message:
          type: string
        clarification:
          oneOf:
            - $ref: '#/components/schemas/Clarification'
            - type: 'null'
        proposal:
          oneOf:
            - $ref: '#/components/schemas/ChangeProposal'
            - type: 'null'
    Clarification:
      type: object
      additionalProperties: false
      required: [id, question, materialReason]
      properties:
        id:
          type: string
          format: uuid
        question:
          type: string
        materialReason:
          enum: [scope, price, accessibility, feasibility, experience, transaction]
    ChangeProposal:
      type: object
      additionalProperties: false
      required: [id, baseTripVersion, operations, affectedFacts, rationale, tradeoffs, warnings, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        baseTripVersion:
          type: integer
          minimum: 1
        operations:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/DraftOperation'
        affectedFacts:
          type: array
          minItems: 1
          items:
            type: string
        rationale:
          type: string
        tradeoffs:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
    DraftOperation:
      type: object
      additionalProperties: false
      required: [operation, target, value]
      properties:
        operation:
          enum: [add, replace, remove, reorder]
        target:
          type: string
          pattern: '^/(availabilityWindows|duration|travellerParty|preferences|constraints|destinations|itineraryDays|components)(/.*)?$'
        value: {}
    AgentEvent:
      oneOf:
        - $ref: '#/components/schemas/ProgressEvent'
        - $ref: '#/components/schemas/ClarificationEvent'
        - $ref: '#/components/schemas/ProposalEvent'
        - $ref: '#/components/schemas/TerminalEvent'
      discriminator:
        propertyName: type
    EventBase:
      type: object
      additionalProperties: false
      required: [version, runId, cursor, type, occurredAt]
      properties:
        version:
          const: '1'
        runId:
          type: string
          format: uuid
        cursor:
          type: integer
          minimum: 1
        type:
          type: string
        occurredAt:
          type: string
          format: date-time
    ProgressEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, stage, message]
          properties:
            type:
              const: progress
            stage:
              enum: [understanding, researching, evaluating, composing]
            message:
              type: string
    ClarificationEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, clarification]
          properties:
            type:
              const: clarification
            clarification:
              $ref: '#/components/schemas/Clarification'
    ProposalEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, proposal]
          properties:
            type:
              const: proposal
            proposal:
              $ref: '#/components/schemas/ChangeProposal'
    TerminalEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, status]
          properties:
            type:
              enum: [completed, failed]
            status:
              enum: [completed, failed]
            safeErrorCode:
              type: [string, 'null']
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type: string
        correlationId:
          type: string
