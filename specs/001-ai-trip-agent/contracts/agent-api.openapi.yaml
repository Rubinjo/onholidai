  "info": {
    "description": "Generated from bounded Pydantic models. Agent runs emit proposals; they do not mutate trips or execute transactions.",
    "title": "OnHolid.ai Internal Agent API",
    "version": "1.0.0"
  },
  "openapi": "3.1.0",
  "paths": {
    "/agent-runs": {
      "post": {
        "operationId": "createAgentRun",
        "parameters": [
          {
            "description": "Identity of the durable web reservation; it is never allocated by the agent.",
            "in": "header",
            "name": "x-agent-run-id",
            "required": true,
            "schema": {
              "format": "uuid",
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateAgentRunRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "202": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AgentRun"
                }
              }
            },
            "description": "Durable scoped run status and typed result"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "409": {
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            },
            "description": "Request fingerprint or base-version conflict"
          },
          "422": {
            "$ref": "#/components/responses/ValidationError"
          }
        },
        "summary": "Start an idempotent research run at an exact trip version"
      }
    },
    "/agent-runs/{runId}": {
      "get": {
        "operationId": "getAgentRun",
        "parameters": [
          {
            "$ref": "#/components/parameters/RunId"
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AgentRun"
                }
              }
            },
            "description": "Durable scoped run status and typed result"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      }
    },
    "/agent-runs/{runId}/clarifications": {
      "post": {
        "operationId": "answerClarification",
        "parameters": [
          {
            "$ref": "#/components/parameters/RunId"
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AnswerClarificationRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "202": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AgentRun"
                }
              }
            },
            "description": "Durable scoped run status and typed result"
          },
          "409": {
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            },
            "description": "Question is stale or already answered"
          }
        }
      }
    },
    "/agent-runs/{runId}/events": {
      "get": {
        "operationId": "streamAgentRunEvents",
        "parameters": [
          {
            "$ref": "#/components/parameters/RunId"
          },
          {
            "in": "query",
            "name": "after",
            "schema": {
              "minimum": 0,
              "type": "integer"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                },
                "x-sse-event-schema": {
                  "$ref": "#/components/schemas/AgentEvent"
                }
              }
            },
            "description": "SSE with monotonic IDs; Last-Event-ID or after resumes replay."
          }
        },
        "summary": "Replay recorded events without rerunning tools"
      }
    }
  },
  "security": [
    {
      "internalService": []
    }
  ],
  "servers": [
    {
      "url": "http://agent:8000/internal/v1"
    }
