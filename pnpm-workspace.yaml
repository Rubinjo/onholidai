packages:
  - web

# pnpm 12 requires an explicit decision for lifecycle scripts. These were ignored under
# pnpm 10; each resolves its platform binary from optional dependencies without scripts.
allowBuilds:
  "@swc/core": false
  protobufjs: false
  unrs-resolver: false

# Exact security-patch exceptions; other packages retain the release-age gate.
minimumReleaseAgeExclude:
  - "@next/env@16.4.3"
  - "@next/eslint-plugin-next@16.4.3"
  - "@next/swc-darwin-arm64@16.4.3"
  - "@next/swc-darwin-x64@16.4.3"
  - "@next/swc-linux-arm64-gnu@16.4.3"
  - "@next/swc-linux-arm64-musl@16.4.3"
  - "@next/swc-linux-x64-gnu@16.4.3"
  - "@next/swc-linux-x64-musl@16.4.3"
  - "@next/swc-win32-arm64-msvc@16.4.3"
  - "@next/swc-win32-x64-msvc@16.4.3"
  - eslint-config-next@16.4.3
  - next@16.4.3
