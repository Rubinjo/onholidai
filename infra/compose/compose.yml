name: onholidai

services:
  postgres:
    image: postgis/postgis:18-3.6
    profiles: [infrastructure]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in .env}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.27.2
    profiles: [infrastructure]
    command: [autosetup]
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in .env}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    ports:
      - "127.0.0.1:7233:7233"
    volumes:
      - ../temporal/development.yaml:/etc/temporal/config/dynamicconfig/development.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, temporal, operator, cluster, health, --address, temporal:7233]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.34.0
    profiles: [infrastructure]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [infrastructure]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: [infrastructure]
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    depends_on:
      - jaeger
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    profiles: [applications]
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://onholidai_web:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@postgres:5432/onholidai"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:?Set SERVICE_TOKEN_SECRET in .env}
      PRICING_DIAGNOSTIC_SECRET: ${PRICING_DIAGNOSTIC_SECRET:?Set PRICING_DIAGNOSTIC_SECRET in .env}
      PROVIDER_MODE: "${PROVIDER_MODE:-deterministic}"
      BOOKING_DEMO_ENABLED: "${BOOKING_DEMO_ENABLED:-false}"
      GUEST_MAX_ACTIVE_RUNS: "${GUEST_MAX_ACTIVE_RUNS:-2}"
      GUEST_MAX_RUNS_PER_HOUR: "${GUEST_MAX_RUNS_PER_HOUR:-10}"
      GUEST_MAX_SESSIONS_PER_HOUR: "${GUEST_MAX_SESSIONS_PER_HOUR:-20}"
      SUPPLIER_PROVIDERS: "${SUPPLIER_PROVIDERS:-{}}"
      DUFFEL_READ_SECRET: "${DUFFEL_READ_SECRET:-}"
      NUITEE_SECRET: "${NUITEE_SECRET:-}"
      NUITEE_ENVIRONMENT: "${NUITEE_ENVIRONMENT:-sandbox}"
      VIATOR_SECRET: "${VIATOR_SECRET:-}"
      VIATOR_ENVIRONMENT: "${VIATOR_ENVIRONMENT:-sandbox}"
      MAPS_GROUNDING_API_KEY: "${MAPS_GROUNDING_API_KEY:-}"
      BETTER_AUTH_URL: http://localhost:3000
      AGENT_BASE_URL: http://agent:8000
      TEMPORAL_ADDRESS: temporal:7233
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      agent:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/api/health').then((response) => { if (!response.ok) process.exit(1) })",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  agent:
    build:
      context: ../..
      dockerfile: agent/Dockerfile
    profiles: [applications]
    environment:
      PROVIDER_MODE: "${PROVIDER_MODE:-deterministic}"
      ENVIRONMENT: production
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:?Set SERVICE_TOKEN_SECRET in .env}
      WEB_BASE_URL: http://web:3000
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_MODEL: ${NEBIUS_MODEL:-synthetic-model}
      MAPS_GROUNDING_API_KEY: ${MAPS_GROUNDING_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://eu.api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_AGENT_ID: ${LANGSMITH_AGENT_ID:-onholidai}
      LANGSMITH_AGENT_ENVIRONMENT: ${LANGSMITH_AGENT_ENVIRONMENT:-local}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    profiles: [applications, migrations]
    command: [pnpm, --filter, "@onholidai/web", db:migrate]
    environment:
      NODE_ENV: production
      PROVIDER_MODE: deterministic
      MIGRATION_DATABASE_URL: "postgresql://onholidai_migration:${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env}@postgres:5432/onholidai"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  booking-worker:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    profiles: [booking]
    command: [pnpm, --filter, "@onholidai/web", booking:worker]
    environment:
      NODE_ENV: production
      PROVIDER_MODE: deterministic
      DATABASE_URL: "postgresql://onholidai_worker:${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}@postgres:5432/onholidai"
      TEMPORAL_ADDRESS: temporal:7233
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
