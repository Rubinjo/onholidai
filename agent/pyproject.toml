[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onholidai-agent"
version = "0.0.0"
description = "Conversational orchestration service for Onholidai"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "langgraph==1.2.14",
    "langsmith==0.14.7",
    "openai==3.28.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
onholidai-agent = "onholidai_agent.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/onholidai_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.0",
]
